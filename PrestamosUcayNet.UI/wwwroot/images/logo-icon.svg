<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Mountain base -->
  <polygon points="10,38 24,14 38,38" fill="#2E7D32"/>
  <polygon points="16,38 24,22 32,38" fill="#43A047"/>

  <!-- Deer silhouette -->
  <g transform="translate(19, 8)">
    <ellipse cx="5" cy="16" rx="5.5" ry="3.5" fill="#1B5E20"/>
    <rect x="3" y="7" width="4" height="9" rx="2" fill="#2E7D32"/>
    <ellipse cx="5" cy="5.5" rx="3" ry="2.8" fill="#2E7D32"/>
    <circle cx="6.2" cy="5" r="0.7" fill="white"/>
    <!-- Antlers -->
    <path d="M3.5,3.5 L0,0" stroke="#E67E22" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M6.5,3.5 L10,0" stroke="#C0392B" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.2" fill="#F39C12"/>
    <circle cx="10" cy="0" r="1.2" fill="#E74C3C"/>
  </g>

  <!-- Accent triangles -->
  <polygon points="13,36 17,29 21,36" fill="#E67E22" opacity="0.85"/>
  <polygon points="27,36 31,29 35,36" fill="#C0392B" opacity="0.85"/>

  <!-- Ground -->
  <line x1="8" y1="39" x2="40" y2="39" stroke="#2E7D32" stroke-width="1.5"/>
</svg>

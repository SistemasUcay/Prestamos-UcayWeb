<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
  <defs>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Mountain / Triangle base -->
  <polygon points="90,180 150,90 210,180" fill="#2E7D32"/>
  <polygon points="120,180 150,120 180,180" fill="#43A047"/>

  <!-- Deer body silhouette -->
  <g transform="translate(130, 55)">
    <!-- Body -->
    <ellipse cx="20" cy="65" rx="22" ry="15" fill="#1B5E20"/>
    <!-- Neck -->
    <rect x="14" y="30" width="12" height="35" rx="5" fill="#2E7D32"/>
    <!-- Head -->
    <ellipse cx="20" cy="25" rx="11" ry="10" fill="#2E7D32"/>
    <!-- Eye -->
    <circle cx="24" cy="23" r="2" fill="white"/>
    <circle cx="24.5" cy="23" r="1" fill="#1B5E20"/>
    <!-- Antlers - colorful -->
    <path d="M15,17 L5,0 L12,10 L8,2 L13,12" fill="none" stroke="#E67E22" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M25,17 L35,0 L28,10 L32,2 L27,12" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="5" cy="0" r="3" fill="#F39C12"/>
    <circle cx="8" cy="2" r="2.5" fill="#E74C3C"/>
    <circle cx="35" cy="0" r="3" fill="#E74C3C"/>
    <circle cx="32" cy="2" r="2.5" fill="#F39C12"/>
    <!-- Front legs -->
    <line x1="10" y1="78" x2="8" y2="100" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="78" x2="30" y2="100" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Colorful geometric accents -->
  <polygon points="100,170 115,145 130,170" fill="#E67E22" opacity="0.85"/>
  <polygon points="170,170 185,145 200,170" fill="#C0392B" opacity="0.85"/>
  <polygon points="135,175 150,155 165,175" fill="#2196F3" opacity="0.7"/>
  <polygon points="85,180 105,180 95,165" fill="#F39C12" opacity="0.8"/>

  <!-- Ground line -->
  <line x1="70" y1="182" x2="230" y2="182" stroke="#2E7D32" stroke-width="3"/>

  <!-- Text: GRUPO -->
  <text x="150" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#2E7D32" letter-spacing="4">GRUPO</text>
  <!-- Text: YAQUI -->
  <text x="150" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900" fill="#2E7D32" letter-spacing="5">YAQUI</text>
</svg>
